<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #0f172a;
      background: #ffffff;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .badge {
      background: #10b981;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .quota-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .quota-title {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      background: #0f172a;
      color: #ffffff;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      box-sizing: border-box;
      border: none;
      margin-bottom: 8px;
    }
    .btn-primary:hover {
      background: #1e293b;
    }
    .btn-outline {
      display: block;
      width: 100%;
      background: #ffffff;
      color: #0f172a;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      font-size: 12px;
    }
    .btn-outline:hover {
      background: #f8fafc;
    }
    .info {
      font-size: 11px;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>⚡ Happpy Agent</span>
    </div>
    <span class="badge">ACTIVE</span>
  </div>

  <div class="quota-box">
    <div class="quota-title">DAILY REFERRAL RUNS</div>
    <div style="font-weight: 700; font-size: 15px;">0 / 4 today used</div>
  </div>

  <button id="run-current-page" class="btn-primary">⚡ Run on This Page</button>
  <a href="#" id="open-dashboard" class="btn-outline">Open Web Dashboard</a>

  <div class="info">
    Navigate to any job listing on LinkedIn, Naukri, Wellfound, or Indeed. Click "Run on This Page" or click the floating widget to discover company employees and send Gmail referrals.
  </div>

  <script src="popup.js"></script>
</body>
</html>
